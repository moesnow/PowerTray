name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (Release)
        run: dotnet build PowerTray.sln -c Release -v minimal

      - name: 电源读写功能自测
        run: dotnet run --project tests/PowerTray.CoreTest -c Release

      - name: 应用自检（弹窗 / 设置 / 托盘菜单加载）
        run: |
          $proc = Start-Process -FilePath 'src\PowerTray\bin\Release\net8.0-windows\PowerTray.exe' -ArgumentList '--selftest' -PassThru -Wait
          Write-Host "selftest exit=$($proc.ExitCode)"
          Get-Content "$env:TEMP\powertray-selftest.txt"
          if (Test-Path "$env:APPDATA\PowerTray\error.log") {
            Write-Host '--- error.log ---'
            Get-Content "$env:APPDATA\PowerTray\error.log"
            throw '运行期出现异常，见 error.log'
          }
        shell: pwsh

      - name: 上传自检截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-screenshots
          path: ${{ runner.temp }}/powertray-*.png
          if-no-files-found: ignore
